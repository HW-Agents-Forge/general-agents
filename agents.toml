# Per-agent settings that cannot be deduced from the Markdown sources.
# `tools`: abstract tools the agent may use (read, search, shell).
# `run` and `diff` have no `read`: they must filter with commands, never read a whole file.
# `tier`: model tier, defaults to "small".

[run]
tools = ["shell"]

[find]
tools = ["search", "read"]

[diff]
tools = ["shell"]

[git]
tools = ["shell"]

[svn]
tools = ["shell"]
