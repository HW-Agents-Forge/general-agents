name: 🐛 Bug report
description: Something in the installer, a target or an agent does not behave as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Report a bug

        A minimal, reproducible report is the fastest way to a fix.

        > [!WARNING]
        > Never paste proprietary or confidential code, logs or paths. Reduce the problem to a small, generic example.

  - type: dropdown
    id: area
    attributes:
      label: 🧩 Where does it happen?
      options:
        - Installer / CLI
        - Target tool (rendering, paths)
        - Configuration (models.toml, agents.toml)
        - Agent prompt (a sub-agent answers wrongly)
        - Skill (atomic-tasks)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 🔥 Impact
      options:
        - Blocks me completely
        - Wrong result, I can work around it
        - Minor / cosmetic
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 💥 What happened, and what did you expect?
      placeholder: "I ran `./install --target claude-code` and got X. I expected Y."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 Steps to reproduce
      description: The exact command and its output. The `--dry-run` output is ideal.
      placeholder: |
        1. ./install --target claude-code --dry-run
        2. ...
      render: shell
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 💻 Environment
      description: Target tool and version, Python version, operating system.
      placeholder: "Claude Code 2.x, Python 3.12, Ubuntu 24.04"

  - type: textarea
    id: agent-details
    attributes:
      label: 🤖 Agent problems only
      description: The agent, the model it ran on, the request you sent and the reply you got.

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Before submitting
      options:
        - label: I searched the existing issues and the [open questions](https://github.com/chabrioche/general-agents/blob/main/docs/open-questions.md).
          required: true
        - label: My report contains nothing proprietary or confidential.
          required: true
        - label: I would be willing to open a pull request for the fix.
