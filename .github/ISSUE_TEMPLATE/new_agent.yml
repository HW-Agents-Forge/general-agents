name: 🤖 New agent
description: Propose a new sub-agent for the catalog.
title: "agent: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Propose a sub-agent

        An agent is accepted only if it **condenses** a large output into a short answer ([ADR 0001](https://github.com/chabrioche/general-agents/blob/main/docs/decisions/0001-keep-only-condensing-agents.md)). Agents that merely add indirection, such as reading a file or listing a directory, are not accepted.

  - type: input
    id: name
    attributes:
      label: 🏷️ Name
      description: Lowercase letters, digits and hyphens.
      placeholder: "log"
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 🎯 Task
      description: What it does, and when the primary agent should call it.
    validations:
      required: true

  - type: textarea
    id: volume
    attributes:
      label: 📉 What large output does it condense?
      description: Typical size of the raw input and of the report it would return.
      placeholder: "A 20,000-line log in, a 15-line report out."
    validations:
      required: true

  - type: dropdown
    id: tools
    attributes:
      label: 🧰 Tools it needs
      multiple: true
      options:
        - read
        - search
        - shell
    validations:
      required: true

  - type: textarea
    id: shell
    attributes:
      label: 🛡️ If it needs shell
      description: Which commands, and why they are safe (read-only, bounded output).

  - type: textarea
    id: boundary
    attributes:
      label: 🚧 Boundary with existing agents
      description: How it differs from `run`, `find`, `diff`, `git` and `svn`, so that nothing overlaps.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: 📋 Output contract
      description: The report format, at most 20 lines.
      render: text

  - type: textarea
    id: scenario
    attributes:
      label: 🧪 Evaluation scenario
      description: A generic scenario showing that it pays for itself, as in the [evaluation protocol](https://github.com/chabrioche/general-agents/blob/main/docs/evaluation.md).
