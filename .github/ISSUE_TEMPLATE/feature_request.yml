name: ✨ Feature request
description: Suggest an improvement to the installer, the configuration or the documentation.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Suggest an improvement

        Start from the problem you want solved rather than from the solution.

        > [!NOTE]
        > Constraints worth keeping in mind: standard library only at runtime, the installer never deletes anything, sources are plain Markdown. A change that goes against an [ADR](https://github.com/chabrioche/general-agents/blob/main/docs/decisions/README.md) needs a new ADR.

  - type: textarea
    id: problem
    attributes:
      label: 🎯 The problem
      description: What are you trying to do that is hard or impossible today?
      placeholder: "When I ..., I have to ..., which is ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 💡 Your proposal
      placeholder: "It would help if ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives you considered

  - type: dropdown
    id: area
    attributes:
      label: 🧩 Area
      multiple: true
      options:
        - Installer / CLI
        - Configuration
        - Targets
        - Agents
        - Skill
        - Documentation
        - CI / tooling

  - type: checkboxes
    id: contribute
    attributes:
      label: 🙌 Contribution
      options:
        - label: I would be willing to implement this.
