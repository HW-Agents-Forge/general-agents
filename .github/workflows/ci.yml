name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Check the frontmatter of agents and skills
        run: python scripts/check_frontmatter.py
